        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }

function pop_TempatFavorite_6(feature, layer) {
    var p = feature.properties;

    function esc(value) {
        return String(value == null ? '-' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    var nama = esc(p['NAMA']);
    var deskripsi = esc(p['DESKRIPSI']);
    var lat = esc(p['LINTANG']);
    var lon = esc(p['BUJUR']);
    var koordinatX = esc(p['X']);
    var koordinatY = esc(p['Y']);

    // Ambil alamat foto dari LINK_FOTO
    
var fotoRaw = String(p['LINK_FOTO'] || '');
var fotoDoc = new DOMParser().parseFromString(
    fotoRaw,
    'text/html'
);

var iframeAsli = fotoDoc.querySelector('iframe');
var imgAsli = fotoDoc.querySelector('img');

var fotoHTML = '';

if (iframeAsli) {
    var src = iframeAsli.getAttribute('src');

    fotoHTML = `
        <iframe
            class="foto-tempat-frame"
            src="${esc(src)}"
            allow="autoplay"
            allowfullscreen>
        </iframe>
    `;
} else if (imgAsli) {
    var src = imgAsli.getAttribute('src');

    fotoHTML = `
        <img
            class="foto-tempat"
            src="${esc(src)}"
            alt="${nama}">
    `;
} else if (fotoRaw.trim()) {
    fotoHTML = `
        <img
            class="foto-tempat"
            src="${esc(fotoRaw.trim())}"
            alt="${nama}">
    `;
} else {
    fotoHTML = '<div class="foto-kosong">Foto tidak tersedia</div>';
}
        
    var popupContent = `
        <div class="popup-favorit">

            <div class="popup-header">
                <span class="popup-nama">${nama}</span>
            </div>

            <div class="popup-deskripsi">
                ${deskripsi}
            </div>

            <div class="popup-foto">
                ${fotoHTML}
            </div>

            <div class="popup-koordinat">

                <div class="koordinat-item">
                    <span class="ikon-koordinat">◎</span>
                    <span>Lat: ${lat}</span>
                </div>

                <div class="koordinat-item">
                    <span class="ikon-koordinat">◎</span>
                    <span>Lon: ${lon}</span>
                </div>

                <div class="koordinat-item">
                    <span class="ikon-koordinat">⊕</span>
                    <span>X: ${koordinatX}</span>
                </div>

                <div class="koordinat-item">
                    <span class="ikon-koordinat">⊕</span>
                    <span>Y: ${koordinatY}</span>
                </div>

            </div>
        </div>
    `;

    layer.bindPopup(popupContent, {
        maxWidth: 440,
        minWidth: 300,
        maxHeight: 600
    });
}
